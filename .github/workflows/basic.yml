name: GitHub Actions 실행시켜보기

on:
  push:
      branches:
        - main
jobs:
  My-Deploy-job:
    runs-on: ubuntu-latest

    steps:
     - name: Hello Word 찍기
       run: echo "Hello World"
     - name: 여러명령어 작성하기
       run: |
        echo "Good"
        echo "Morning"
     - name: GitHub Actions 자체에 저장되어 있는 변수 사용해보기
       run: |
        echo $GITHUB_SHA
        echo $GITHUB_REPOSITORY
     - name: 아무나 못보는 값
       run: |
        echo ${{ secrets.MY_NAME}}